name: ObjectForge3D

options:
  bundleIdPrefix: com.continuum
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  ObjectForge3D:
    type: application
    platform: iOS
    sources:
      - ObjectForge3D
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.continuum.objectforge3d
        INFOPLIST_FILE: ObjectForge3D/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: ObjectForge3D/Info.plist
      properties:
        CFBundleDisplayName: ObjectForge 3D
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: ObjectForge imports photos to generate printable 3D relief models.
        NSCameraUsageDescription: Future ObjectForge scan mode can use the camera to capture parts for 3D modeling.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
