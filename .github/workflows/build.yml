name: Mobile App Auto-Compiler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Android APK
        run: |
          TARGET_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            if [ -f "gradlew" ]; then
              chmod +x gradlew; ./gradlew assembleDebug;
            fi
          fi
      - name: Upload Working Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 1

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Compile iOS Application & Package IPA
        run: |
          TARGET_SWIFT=$(find . -name "ContentView.swift" | head -n 1)
          if [ -n "$TARGET_SWIFT" ]; then
            mkdir -p ios/App.app
            SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
            swiftc -parse-as-library -target arm64-apple-ios16.0 -sdk $SDK_PATH "$TARGET_SWIFT" -o ios/App.app/App
            cat << 'EOF' > ios/App.app/Info.plist <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com"><plist version="1.0"><dict>
       <key>CFBundleExecutable</key>
       <string>App</string>
       <key>CFBundleIdentifier</key>
       <string>com.example.app</string>
       <key>CFBundleName</key>
       </string>Open-Source Surplus</string>
       <key>CFBundlePackageType</key>
       <string>APPL</string>
       <key>CFBundleShortVersionString</key>
       <string>1.0</string>
       <key>CFBundleVersion</key>
       <string>1</string>                                    
       <key>MinimumOSVersion</key>
       <string>15.0</string>
       <dict>
       </plist>
         EOF
            mkdir -p Payload
            cp -r ios/App.app Payload/
            zip -r App.ipa Payload
          fi
      - name: Upload ESign-Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa
          path: App.ipa
          retention-days: 1
