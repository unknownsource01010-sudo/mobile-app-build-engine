<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 Not Found</title>
  <style>
    body { 
      background-color: #fff; 
      color: #000; 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      text-align: center; 
      padding: 30px 15px; 
      margin: 0; 
    }
    #lockScreen { display: block; }
    #realWorkspace { 
      display: none; 
      text-align: left; 
      max-width: 500px; 
      margin: 0 auto; 
      background: #0d1117; 
      color: #c9d1d9; 
      border-radius: 8px; 
      padding: 20px; 
      box-sizing: border-box; 
    }
    #hiddenInput { 
      position: absolute; 
      top: -100px; 
      opacity: 0; 
      width: 1px; 
      height: 1px; 
    }
    .upload-area { 
      border: 2px dashed #30363d; 
      border-radius: 6px; 
      padding: 25px; 
      text-align: center; 
      background: #161b22; 
      margin-bottom: 15px; 
      cursor: pointer; 
    }
button { 
      background: #238636; 
      color: white; 
      padding: 12px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      width: 100%; 
      border: none; 
      font-size: 15px; 
      margin-bottom: 10px;
    }
    button.secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    #fileList { 
      font-family: monospace; 
      font-size: 11px; 
      color: #b8b949; 
      background: #0d1117; 
      padding: 8px; 
      border-radius: 4px; 
      max-height: 100px; 
      overflow-y: auto; 
      margin-bottom: 15px; 
      border: 1px solid #30363d; 
    }
    .config-panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .config-group { margin-bottom: 12px; }
    .config-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    .config-group input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px;
      color: #c9d1d9;
      box-sizing: border-box;
      font-size: 14px;
    }
    #trackerPanel {
      background: #161b22;
      border-left: 4px solid #2188ff;
      padding: 12px;
      margin-top: 15px;
      border-radius: 0 6px 6px 0;
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .badge.queued { background: #6e7681; color: #fff; }
    .badge.progress { background: #9a6700; color: #fff; }
    .badge.success { background: #238636; color: #fff; }
    .badge.failed { background: #da3633; color: #fff; }
  </style>
</head>
 <body>
  <input type="text" id="hiddenInput" autocomplete="off" autocapitalize="off">

  <!-- Decoy Lock Screen -->
  <div id="lockScreen">
    <h1 style="margin-top: 50px;">404 Not Found</h1>
    <p>The requested directory was not found on this server.</p>
    <hr style="max-width:400px; border:0; border-top:1px solid #eee; margin:20px auto;">
    <p style="font-size:12px; color:#999;">nginx/1.18.0 (Ubuntu)</p>
  </div>

  <!-- Real App Workspace Interface -->
  <div id="realWorkspace">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="margin:0;">Mobile Kit Packager Pro</h3>
      <button class="secondary" style="width: auto; margin: 0; padding: 6px 12px; font-size: 12px;" onclick="toggleConfig()">⚙️ Settings</button>
    </div>

    <!-- Isolated Configuration Panel Layer -->
    <div id="configPanel" class="config-panel" style="display: none;">
      <div class="config-group">
        <label>GitHub Personal Access Token (Classic)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>
      <div class="config-group">
        <label>GitHub Account Username</label>
        <input type="text" id="ghOwner" placeholder="octocat">
      </div>
      <div class="config-group">
        <label>Authorized Repository Name</label>
        <input type="text" id="ghRepo" placeholder="my-authorized-repo">
      </div>
      <button style="padding: 8px;" onclick="saveConfiguration()">Save Configuration Profile</button>
    </div>
    
    <div class="upload-area" onclick="document.getElementById('folderPicker').click()">
      <span style="font-size: 24px;">📁</span>
      <p id="uploadStatus" style="margin: 8px 0 0 0; font-size:14px; font-weight: bold;">Tap to Select Folder Workspace</p>
      <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;">
    </div>

    <div id="fileList" style="display:none;"></div>
    <button onclick="processAndDeployRepository()">🚀 Direct Path Push & Auto-Compile</button>

    <!-- CI/CD Status Dashboard Component Tracker -->
    <div id="trackerPanel">
      <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
        <span>Active Remote Build Tracker Status:</span>
        <span id="buildBadge" class="badge queued">Idle</span>
      </div>
      <div id="trackerDetails" style="font-size: 11px; color: #8b949e; font-family: monospace;">No execution runs parsed yet. Trigger code engine upload chain.</div>
    </div>
  </div>
 <script>
    const SECRET_LOCK_CODE = "unlock";
    const hiddenInput = document.getElementById("hiddenInput");
    let stagedFilesList = [];
    let pollingInterval = null;

    document.body.addEventListener("click", () => {
      if (hiddenInput) hiddenInput.focus();
    });

    hiddenInput.addEventListener("input", function() {
      if (this.value.toLowerCase().endsWith(SECRET_LOCK_CODE)) {
        document.body.style.backgroundColor = "#0d1117";
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("realWorkspace").style.display = "block";
        loadConfiguration();
        hiddenInput.blur();
        hiddenInput.parentNode.removeChild(hiddenInput);
      }
    });

    function toggleConfig() {
      const panel = document.getElementById("configPanel");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    }

    function saveConfiguration() {
      localStorage.setItem("MKP_TOKEN", document.getElementById("ghToken").value.trim());
      localStorage.setItem("MKP_OWNER", document.getElementById("ghOwner").value.trim());
      localStorage.setItem("MKP_REPO", document.getElementById("ghRepo").value.trim());
      alert("Configuration profile locked to local storage cache.");
      toggleConfig();
    }

    function loadConfiguration() {
      document.getElementById("ghToken").value = localStorage.getItem("MKP_TOKEN") || "";
      document.getElementById("ghOwner").value = localStorage.getItem("MKP_OWNER") || "";
      document.getElementById("ghRepo").value = localStorage.getItem("MKP_REPO") || "";
    }

    document.getElementById('folderPicker').addEventListener('change', function(e) {
      stagedFilesList = e.target.files;
      if (stagedFilesList.length > 0) {
        document.getElementById('uploadStatus').innerText = `✅ Verified ${stagedFilesList.length} Native Sub-Files`;
        const listDiv = document.getElementById('fileList');
        listDiv.style.display = "block";
        
        let pathPreview = Array.from(stagedFilesList)
          .map(f => f.webkitRelativePath)
          .slice(0, 3)
          .join("<br>");
        
        if (stagedFilesList.length > 3) pathPreview += "<br>...";
        listDiv.innerHTML = `<strong>Source Manifest Tree Matrix View:</strong><br>${pathPreview}`;
      }
    });

    const getWorkflowRecipe = () => `name: Mobile App Auto-Compiler
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Android APK
        run: |
          TARGET_DIR=\$(find . -name "build.gradle" -exec dirname {} \\; | head -n 1)
          if [ -n "\$TARGET_DIR" ]; then
            cd "\$TARGET_DIR"
            if [ -f "gradlew" ]; then
              chmod +x gradlew; ./gradlew assembleDebug;
            fi
          fi
      - name: Upload Working Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 1

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Compile iOS Application & Package IPA
        run: |
          TARGET_SWIFT=\$(find . -name "ContentView.swift" | head -n 1)
          if [ -n "\$TARGET_SWIFT" ]; then
            mkdir -p ios/App.app
            SDK_PATH=\$(xcrun --sdk iphoneos --show-sdk-path)
            swiftc -parse-as-library -target arm64-apple-ios16.0 -sdk \$SDK_PATH "\$TARGET_SWIFT" -o ios/App.app/App
            cat << 'EOF' > ios/App.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
<plist version="1.0">
<dict>
  <key>CFBundleExecutable</key>
  <string>App</string>
  <key>CFBundleIdentifier</key>
  <string>com.example.app</string>
  <key>CFBundleName</key>
  <string>Open-Source Surplus</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
  <key>CFBundleVersion</key>
  <string>1</string>
  <key>MinimumOSVersion</key>
  <string>15.0</string>
</dict>
</plist>
EOF
            mkdir -p Payload
            cp -r ios/App.app Payload/
            zip -r App.ipa Payload
          fi
      - name: Upload ESign-Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa
          path: App.ipa
          retention-days: 1
`;
async function processAndDeployRepository() {
      const TOKEN = (document.getElementById("ghToken")?.value || localStorage.getItem("MKP_TOKEN") || "").trim();
      const OWNER = (document.getElementById("ghOwner")?.value || localStorage.getItem("MKP_OWNER") || "").trim();
      const REPO = (document.getElementById("ghRepo")?.value || localStorage.getItem("MKP_REPO") || "").trim();

      // Save exactly the values this run is using, so stale localStorage cannot win.
      localStorage.setItem("MKP_TOKEN", TOKEN);
      localStorage.setItem("MKP_OWNER", OWNER);
      localStorage.setItem("MKP_REPO", REPO);

      if (!TOKEN || !OWNER || !REPO) {
        alert("Missing targets! Open ⚙️ Settings and check profile configs.");
        return toggleConfig();
      }

      if (stagedFilesList.length === 0) {
        return alert("Please pick an offline project build folder workspace target first.");
      }

      // Accept either a raw PAT or a token pasted with a common prefix.
      const CLEAN_TOKEN = TOKEN.replace(/^(token|bearer)\s+/i, "").replace(/\s+/g, "").trim();
      const headers = {
        "Authorization": `Bearer ${CLEAN_TOKEN}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      };

      try {
        const tokenHint = CLEAN_TOKEN.length >= 8 ? `${CLEAN_TOKEN.slice(0,4)}…${CLEAN_TOKEN.slice(-4)} (${CLEAN_TOKEN.length} chars)` : `length ${CLEAN_TOKEN.length}`;
        document.getElementById('uploadStatus').innerText = `⏳ Checking GitHub credentials using ${tokenHint}...`;

        const authResponse = await fetch("https://api.github.com/user", {
          method: "GET",
          headers: headers
        });
        const authData = await authResponse.json().catch(() => ({}));

        if (!authResponse.ok) {
          const msg = authData.message || "GitHub rejected the token.";
          if (authResponse.status === 401) {
            throw new Error("GitHub authentication failed (401): Bad credentials. Replace the PAT in Settings; the token is invalid, expired, revoked, or pasted incorrectly.");
          }
          throw new Error(`GitHub authentication check failed (${authResponse.status}): ${msg}`);
        }

        document.getElementById('uploadStatus').innerText =
          `✅ GitHub authenticated as ${authData.login || OWNER}. Checking repository access...`;

        const repoResponse = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(OWNER)}/${encodeURIComponent(REPO)}`,
          { method: "GET", headers: headers }
        );
        const repoData = await repoResponse.json().catch(() => ({}));

        if (!repoResponse.ok) {
          throw new Error(
            `Repository access failed (${repoResponse.status}): ${repoData.message || "Repository could not be accessed."}`
          );
        }

        document.getElementById('uploadStatus').innerText =
          `✅ GitHub access confirmed: ${OWNER}/${REPO}. Starting file sync...`;

        for (let i = 0; i < stagedFilesList.length; i++) {
          const file = stagedFilesList[i];
          let relativePath = file.webkitRelativePath;
          
          const parts = relativePath.split('/');
          parts.shift(); 
          const cleanPath = parts.join('/');

          if (!cleanPath) continue;

          document.getElementById('uploadStatus').innerText = `⏳ Syncing (${i + 1}/${stagedFilesList.length}): ${cleanPath}`;
          
          const base64Content = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const base64Parts = reader.result.split(',');
              // FIXED ARRAY INDEX BUG: Safely targets index position 1 to supply clean text base64 payloads only
              resolve(base64Parts[1]);
            };
            reader.onerror = () => reject(new Error("File conversion failure."));
            reader.readAsDataURL(file);
          });

          let sha = null;
          try {
            const fileCheck = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${cleanPath}`, { 
              method: "GET",
              headers: headers
            });
            if (fileCheck.ok) {
              const data = await fileCheck.json();
              sha = data.sha;
            }
          } catch (e) {}

          const commitBody = {
            message: `Mobile Kit Packager automated classic sync: ${cleanPath}`,
            content: base64Content,
            branch: "main"
          };
          if (sha) commitBody.sha = sha;

          const uploadCall = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${cleanPath}`, {
            method: "PUT",
            headers: headers,
            body: JSON.stringify(commitBody)
          });

          if (!uploadCall.ok) {
            const errLog = await uploadCall.json().catch(() => ({}));
            const detail = errLog.message || "Unknown GitHub API error";
            if (uploadCall.status === 401) {
              throw new Error(`Commit route rejected [${cleanPath}] (401): Bad credentials. GitHub is rejecting the PAT.`);
            }
            if (uploadCall.status === 403) {
              throw new Error(`Commit route rejected [${cleanPath}] (403): ${detail}. The token is valid but lacks permission for this repository.`);
            }
            throw new Error(`Commit route rejected [${cleanPath}] (${uploadCall.status}): ${detail}`);
          }
        }

        document.getElementById('uploadStatus').innerText = "⏳ Routing compiler recipe pipelines...";
        const workflowText = getWorkflowRecipe();
        const workflowB64 = btoa(unescape(encodeURIComponent(workflowText)));
        
        let wfSha = null;
        try {
          const wfCheck = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/.github/workflows/build.yml`, { 
            method: "GET", 
            headers: headers 
          });
          if (wfCheck.ok) {
            const wfData = await wfCheck.json();
            wfSha = wfData.sha;
          }
        } catch (e) {}

        const wfBody = {
          message: "Configure Active Automated Continuous Integration Workflow Configuration Template Profile",
          content: workflowB64,
          branch: "main"
        };
        if (wfSha) wfBody.sha = wfSha;

        const workflowUpload = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/.github/workflows/build.yml`, {
          method: "PUT",
          headers: headers,
          body: JSON.stringify(wfBody)
        });

        if (!workflowUpload.ok) {
          const wfErr = await workflowUpload.json().catch(() => ({}));
          throw new Error(`Workflow commit rejected (${workflowUpload.status}): ${wfErr.message || "Unknown GitHub API error"}`);
        }

        document.getElementById('uploadStatus').innerText = "✅ Target synced and repository trunk updated!";
        startCIBuildTracking(OWNER, REPO, headers);

      } catch (err) {
        alert(`System Failure: ${err.message}`);
        document.getElementById('uploadStatus').innerText = "❌ Processing deployment error occurred.";
      }
    }

    function startCIBuildTracking(owner, repo, headers) {
      const trackerPanel = document.getElementById("trackerPanel");
      const badge = document.getElementById("buildBadge");
      const details = document.getElementById("trackerDetails");

      trackerPanel.style.display = "block";
      badge.className = "badge queued";
      badge.innerText = "polled";
      details.innerHTML = "Initializing telemetry query scan hooks connection with remote system instance...";

      if (pollingInterval) clearInterval(pollingInterval);

      let counter = 0;
      pollingInterval = setInterval(async () => {
        counter++;
        try {
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, { 
            method: "GET",
            headers: headers 
          });
          if (response.ok) {
            const data = await response.json();
            if (data.workflow_runs && data.workflow_runs.length > 0) {
              // FIXED ARRAY INDEX BUG: Isolates index position 0 to cleanly hook into the latest compile run payload array item
              const run = data.workflow_runs[0];
              
              details.innerHTML = `Run ID: #${run.id}<br>Event: ${run.event}<br>Trigger: ${run.head_commit.message.slice(0, 40)}...<br>Updated: ${new Date(run.updated_at).toLocaleTimeString()}`;
              
              if (run.status === "queued") {
                badge.className = "badge queued";
                badge.innerText = "queued";
              } else if (run.status === "in_progress" || run.status === "waiting") {
                badge.className = "badge progress";
                badge.innerText = "compiling";
              } else if (run.status === "completed") {
                clearInterval(pollingInterval);
                if (run.conclusion === "success") {
                  badge.className = "badge success";
                  badge.innerText = "success";
                  alert("Compilation pipeline completed successfully! Access binary artifacts upstream.");
                } else {
                  badge.className = "badge failed";
                  badge.innerText = "failed";
                  alert("Compilation run sequence terminated with structural errors.");
                }
              }
            } else {
              details.innerText = `Waiting for GitHub Actions clusters initialization... (Attempt ${counter})`;
            }
          }
        } catch (e) {
          details.innerText = `Telemetry dropped framework tracking error: ${e.message}`;
        }
      }, 5000);
    }
  </script>
</body>
</html>
